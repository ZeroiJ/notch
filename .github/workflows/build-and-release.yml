name: Build & Release Dynamic Notch APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/DynamicNotch-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/*.apk release-artifacts/DynamicNotch-v1.0.0-debug.apk
          ls -la release-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-APKs
          path: release-artifacts/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Dynamic Notch v1.0.0 — Nothing Phone (4b) Edition"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/DynamicNotch-v1.0.0-release.apk
            release-artifacts/DynamicNotch-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
